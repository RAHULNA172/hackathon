version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: work_prioritization_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  ai-service:
    build: 
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: work_prioritization_ai
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: work_prioritization_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/work_prioritization
      - JWT_SECRET=super_secret_jwt_key_123
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - mongodb
      - ai-service

volumes:
  mongodb_data:
